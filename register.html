<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration and Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>Pharmacy Management System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="medicines.html">Medicines</a>
        <a href="register.html">Register / Login</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<main>

    <section class="form-section">

        <h2>Customer Registration</h2>

        <form id="registerForm">

            <label>Full Name</label>
            <input
                type="text"
                id="name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="email"
                required
            >

            <label>Phone Number</label>
            <input
                type="tel"
                id="phone"
                pattern="[0-9]{10}"
                placeholder="10 digit number"
                required
            >

            <label>Date of Birth</label>
            <input
                type="date"
                id="dob"
                required
            >

            <label>Gender</label>

            <div class="radio">

                <input
                    type="radio"
                    name="gender"
                    value="Male"
                    required
                >
                Male

                <input
                    type="radio"
                    name="gender"
                    value="Female"
                >
                Female

            </div>

            <label>Address</label>

            <textarea
                id="address"
                rows="4"
                required
            ></textarea>

            <label>Password</label>

            <input
                type="password"
                id="password"
                minlength="6"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <hr>

        <h2>Login</h2>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </section>

</main>

<footer>
    <p>© 2026 Pharmacy Management System</p>
</footer>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>Pharmacy Management System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="medicines.html">Medicines</a>
        <a href="register.html">Register / Login</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<main>

    <section class="form-section">

        <h2>Contact Us</h2>

        <form id="contactForm">

            <label>Name</label>

            <input
                type="text"
                id="contactName"
                required
            >

            <label>Email</label>

            <input
                type="email"
                id="contactEmail"
                required
            >

            <label>Subject</label>

            <select id="subject" required>

                <option value="">Select Subject</option>
                <option>Medicine Information</option>
                <option>Customer Support</option>
                <option>Other</option>

            </select>

            <label>Message</label>

            <textarea
                id="message"
                rows="5"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</main>

<footer>
    <p>© 2026 Pharmacy Management System</p>
</footer>

<script src="script.js"></script>

</body>
</html>
